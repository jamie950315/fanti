name: TWConvert
options:
  bundleIdPrefix: dev.jamie
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
targets:
  TWConvert:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Vendor/opencc/dict
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamie.TWConvert
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TWConvert-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/opencc/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/opencc/lib
        OTHER_LDFLAGS: -lopencc -lmarisa -lc++
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: TWConvert
        INFOPLIST_KEY_NSHumanReadableCopyright: "OpenCC dictionaries © OpenCC contributors, Apache-2.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N3JN8G9YWK
        CODE_SIGN_IDENTITY: Apple Development
        ARCHS: $(ARCHS_STANDARD)
